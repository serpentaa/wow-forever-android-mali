name: Build Mali APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch runtime components
        run: |
          chmod +x tools/fetch_components.sh
          ./tools/fetch_components.sh

      - name: Create local.properties and Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleModernRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-Mali-APK
          path: app/build/outputs/apk/modern/release/*.apk
