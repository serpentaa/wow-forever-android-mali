name: Build Mali APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fetch runtime components
        run: |
          chmod +x tools/fetch_components.sh
          ./tools/fetch_components.sh

      - name: Patch client for WoW Forever full release (wowf)
        run: |
          find app/src/main/java -type f -name "*.kt" -exec sed -i 's/wow_classic_beta/wowf/g; s/_classic_beta_/_forever_/g; s/WowB-ARM64\.exe/Wow-ARM64.exe/g; s|http://us\.patch\.battle\.net|https://battle.net|g' {} +

      - name: Create local.properties and Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleModernRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-Mali-APK
          path: app/build/outputs/apk/modern/release/*.apk
